services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8082}:8080"
    volumes:
      - ./docker/keycloak/realm-orkest.json:/opt/keycloak/data/import/realm-orkest.json:ro
      - keycloak_data:/opt/keycloak/data
  postgres:
    image: postgres:18.3-alpine3.23
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USERNAME:?Set POSTGRES_USERNAME in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?Set POSTGRES_PORT in .env}:5432"
    volumes:
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  registry:
    image: registry:3
    ports:
      - "127.0.0.1:${REGISTRY_PORT:-5001}:5000"
    volumes:
      - registry_data:/var/lib/registry

volumes:
  postgres18_data:
  keycloak_data:
  registry_data:

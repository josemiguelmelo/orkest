name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}
      image_tag: ${{ steps.version.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Calculate next semantic version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          previous_tag="$(git tag --list 'v[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          if [[ -z "$previous_tag" ]]; then
            major=0 minor=0 patch=0
            commits="$(git log --format='%B' HEAD)"
          else
            version="${previous_tag#v}"
            IFS=. read -r major minor patch <<< "$version"
            commits="$(git log --format='%B' "${previous_tag}..HEAD")"
          fi
          if [[ -z "$commits" ]]; then
            echo "No commits since ${previous_tag}; nothing to release."
            exit 1
          fi
          if grep -Eq '(^|\n).*!:|BREAKING CHANGE:' <<< "$commits"; then
            major=$((major + 1)); minor=0; patch=0
          elif grep -Eq '(^|\n)(feat|feature)(\([^)]*\))?:' <<< "$commits"; then
            minor=$((minor + 1)); patch=0
          else
            patch=$((patch + 1))
          fi
          version="${major}.${minor}.${patch}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "previous_tag=${previous_tag}" >> "$GITHUB_OUTPUT"
          echo "image_tag=v${version}" >> "$GITHUB_OUTPUT"

  release:
    name: Publish release
    needs: prepare
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish Orkest server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/docker/orkest.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/orkest:${{ needs.prepare.outputs.image_tag }}
            ghcr.io/${{ github.repository_owner }}/orkest:latest
      - name: Publish agentctl base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/docker/agentctl-base.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/agentctl-base:${{ needs.prepare.outputs.image_tag }}
            ghcr.io/${{ github.repository_owner }}/agentctl-base:latest
      - name: Publish runtime images
        shell: bash
        env:
          VERSION_TAG: ${{ needs.prepare.outputs.image_tag }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          for runtime in opencode claude-code codex github-copilot kiro; do
            docker buildx build \
              --file "build/docker/agentctl-${runtime}.Dockerfile" \
              --build-arg "AGENTCTL_BASE_IMAGE=ghcr.io/${OWNER}/agentctl-base:${VERSION_TAG}" \
              --tag "ghcr.io/${OWNER}/agentctl-${runtime}:${VERSION_TAG}" \
              --tag "ghcr.io/${OWNER}/agentctl-${runtime}:latest" \
              --push .
          done
      - name: Create GitHub release and version tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          git tag "$tag" "${GITHUB_SHA}"
          git push origin "$tag"
          if [[ -n "$PREVIOUS_TAG" ]]; then
            gh release create "$tag" --generate-notes --notes-start-tag "$PREVIOUS_TAG"
          else
            gh release create "$tag" --generate-notes
          fi

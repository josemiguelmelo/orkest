name: Runtime conformance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  runtime-conformance:
    name: Runtime conformance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runtime: [opencode, claude-code, codex, github-copilot, kiro]
    environment: runtime-qualification
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5.5.0
        with:
          go-version-file: go.mod
      - name: Deterministic contract and recovery tests
        run: make test-runtime-conformance
      - name: Identify versions requiring live qualification
        id: qualification
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 tools/runtime/runtime-qualification.py "$BASE_REVISION"
      - name: Report pending live qualification
        if: contains(steps.qualification.outputs.runtimes, matrix.runtime) && vars.ORKEST_RUN_LIVE_QUALIFICATION != 'true'
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: echo "Live qualification for $RUNTIME is pending; set ORKEST_RUN_LIVE_QUALIFICATION=true in the runtime-qualification environment after credentials and test endpoints are configured."
      - uses: actions/setup-node@v4.4.0
        if: contains(steps.qualification.outputs.runtimes, matrix.runtime) && vars.ORKEST_RUN_LIVE_QUALIFICATION == 'true'
        with:
          node-version: 22.22.2
      - name: Install pinned runtime
        if: contains(steps.qualification.outputs.runtimes, matrix.runtime) && vars.ORKEST_RUN_LIVE_QUALIFICATION == 'true'
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: |
          VERSION=$(python3 -c 'import json, os; print(json.load(open("internal/contracts/runtimecatalog/versions.json"))[os.environ["RUNTIME"]].removeprefix("opencode v"))')
          if [[ "$RUNTIME" == "kiro" ]]; then test "$VERSION" = "2.37.0"; fi
          case "$RUNTIME" in
            opencode) npm install --global "@opencode/cli@$VERSION" ;;
            claude-code) npm install --global "@agentclientprotocol/claude-agent-acp@$VERSION" ;;
            codex) npm install --global "@agentclientprotocol/codex-acp@$VERSION" ;;
            github-copilot) npm install --global "@github/copilot@$VERSION" ;;
            kiro) \
              curl -fsSL "https://prod.download.cli.kiro.dev/stable/$VERSION/kirocli-x86_64-linux.tar.gz" -o /tmp/kiro-cli.tar.gz; \
              echo "02c49873ba64285f34048aac377ccf0b546b5627f39dd775bae9fa306112ff19  /tmp/kiro-cli.tar.gz" | sha256sum -c -; \
              mkdir /tmp/kiro-cli && tar -xzf /tmp/kiro-cli.tar.gz -C /tmp/kiro-cli; \
              sudo env Q_INSTALL_GLOBAL=1 Q_SKIP_SETUP=1 /tmp/kiro-cli/kirocli/install.sh; \
              kiro-cli --version | grep -F "$VERSION" ;;
            *) echo "No pinned installer for $RUNTIME"; exit 1 ;;
          esac
      - name: Strict live qualification (missing settings fail)
        if: contains(steps.qualification.outputs.runtimes, matrix.runtime) && vars.ORKEST_RUN_LIVE_QUALIFICATION == 'true'
        env:
          ORKEST_OPENCODE_BINARY: opencode
          ORKEST_CLAUDE_CODE_BINARY: claude-agent-acp
          ORKEST_CODEX_BINARY: codex-acp
          ORKEST_GITHUB_COPILOT_BINARY: copilot
          ORKEST_KIRO_BINARY: kiro-cli
          QUALIFY_RUNTIME: ${{ matrix.runtime }}
          ORKEST_TEST_MODEL_PROVIDER: ${{ matrix.runtime == 'claude-code' && 'anthropic' || matrix.runtime == 'codex' && 'openai' || matrix.runtime == 'github-copilot' && 'github-copilot' || matrix.runtime == 'kiro' && 'kiro' || vars.ORKEST_TEST_MODEL_PROVIDER }}
          ORKEST_TEST_MODEL_ID: ${{ matrix.runtime == 'claude-code' && vars.ORKEST_CLAUDE_CODE_TEST_MODEL_ID || matrix.runtime == 'codex' && vars.ORKEST_CODEX_TEST_MODEL_ID || matrix.runtime == 'github-copilot' && vars.ORKEST_GITHUB_COPILOT_TEST_MODEL_ID || matrix.runtime == 'kiro' && vars.ORKEST_KIRO_TEST_MODEL_ID || matrix.runtime == 'opencode' && vars.ORKEST_TEST_MODEL_ID || '' }}
          ORKEST_TEST_PROVIDER_ENV: ${{ vars.ORKEST_TEST_PROVIDER_ENV }}
          ORKEST_TEST_APPROVAL_PROMPT: ${{ vars.ORKEST_TEST_APPROVAL_PROMPT }}
          ORKEST_TEST_RECOVERY_PROMPT: ${{ vars.ORKEST_TEST_RECOVERY_PROMPT }}
          ORKEST_TEST_CANCELLATION_PROMPT: ${{ vars.ORKEST_TEST_CANCELLATION_PROMPT }}
          ORKEST_TEST_QUESTION_PROMPT: ${{ vars.ORKEST_TEST_QUESTION_PROMPT }}
          ORKEST_TEST_QUESTION_EXPECTED: ${{ vars.ORKEST_TEST_QUESTION_EXPECTED }}
          ORKEST_TEST_MCP_URL: ${{ vars.ORKEST_TEST_MCP_URL }}
          ORKEST_TEST_MCP_PROMPT: ${{ vars.ORKEST_TEST_MCP_PROMPT }}
          ORKEST_TEST_MCP_EXPECTED: ${{ vars.ORKEST_TEST_MCP_EXPECTED }}
          ORKEST_TEST_STDIO_MCP_COMMAND: ${{ vars.ORKEST_TEST_STDIO_MCP_COMMAND }}
          ORKEST_TEST_STDIO_MCP_ARGS: ${{ vars.ORKEST_TEST_STDIO_MCP_ARGS }}
          ORKEST_TEST_STDIO_MCP_ENV: ${{ secrets.ORKEST_TEST_STDIO_MCP_ENV }}
          ORKEST_TEST_STDIO_MCP_PROMPT: ${{ vars.ORKEST_TEST_STDIO_MCP_PROMPT }}
          ORKEST_TEST_STDIO_MCP_EXPECTED: ${{ vars.ORKEST_TEST_STDIO_MCP_EXPECTED }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          KIRO_API_KEY: ${{ secrets.KIRO_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: make qualify-runtime

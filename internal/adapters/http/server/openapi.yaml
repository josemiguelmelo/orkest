openapi: 3.1.0
info:
  title: Orkest API
  version: 0.0.0
tags:
  - name: RuntimeProviders
    description: Supported runtime provider configuration schemas.
  - name: System
    description: Process health and service metadata.
  - name: Authentication
    description: Sign in and sign out through the configured OpenID Connect provider.
  - name: Users
    description: Operations for the authenticated user.
  - name: Organizations
    description: Organizations and organization memberships.
  - name: Workspaces
    description: Workspaces and workspace memberships.
  - name: WorkspaceEnvironment
    description: Workspace-scoped environment variables and secrets.
  - name: ExecutionProfiles
    description: Workspace execution toolchains and asynchronous image builds.
  - name: AgentRuntimeProfiles
    description: Workspace presets for runtime and model selection.
  - name: Agents
    description: Workspace-scoped reusable agent definitions.
  - name: Skills
    description: Global, organization, and workspace Agent Skills catalog.
  - name: MCPServers
    description: Workspace-scoped HTTP MCP server connections.
  - name: CodeRepositories
    description: Workspace-scoped code repository registration and Git operations.
  - name: CodingIntegrations
    description: Workspace-scoped authenticated coding provider connections.
  - name: TaskIntegrations
    description: Workspace-scoped external task source integrations.
  - name: Tasks
    description: Workspace-scoped tasks, comments, and repository associations.
paths:
  /api/runtime-providers:
    get:
      tags: [RuntimeProviders]
      operationId: listRuntimeProviders
      security: [{bearerAuth: []}, {cookieAuth: []}]
      responses:
        "200": {description: Runtime providers and supported environment configuration, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/RuntimeProvider"}}}}}
  /api/organizations/{orgID}/workspaces/{workspaceID}/agent-runtime-profiles:
    parameters:
      - {name: orgID, in: path, required: true, schema: {type: string}}
      - {name: workspaceID, in: path, required: true, schema: {type: string}}
    get:
      tags: [AgentRuntimeProfiles]
      operationId: listAgentRuntimeProfiles
      security: [{bearerAuth: []}, {cookieAuth: []}]
      responses:
        "200": {description: Runtime profiles, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/AgentRuntimeProfile"}}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      tags: [AgentRuntimeProfiles]
      operationId: createAgentRuntimeProfile
      security: [{bearerAuth: []}, {cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AgentRuntimeProfileInput"}
      responses:
        "201": {description: Runtime profile created and applied to linked agents, content: {application/json: {schema: {$ref: "#/components/schemas/AgentRuntimeProfile"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /api/organizations/{orgID}/workspaces/{workspaceID}/agent-runtime-profiles/{profileID}:
    parameters:
      - {name: orgID, in: path, required: true, schema: {type: string}}
      - {name: workspaceID, in: path, required: true, schema: {type: string}}
      - {name: profileID, in: path, required: true, schema: {type: string}}
    put:
      tags: [AgentRuntimeProfiles]
      operationId: updateAgentRuntimeProfile
      security: [{bearerAuth: []}, {cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AgentRuntimeProfileInput"}
      responses:
        "200": {description: Runtime profile updated and applied to linked agents, content: {application/json: {schema: {$ref: "#/components/schemas/AgentRuntimeProfile"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags: [AgentRuntimeProfiles]
      operationId: deleteAgentRuntimeProfile
      security: [{bearerAuth: []}, {cookieAuth: []}]
      responses:
        "204": {description: Runtime profile deleted; linked agents retain their last model settings}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/organizations/{orgID}/workspaces/{workspaceID}/execution-profiles:
    parameters:
      - {name: orgID, in: path, required: true, schema: {type: string}}
      - {name: workspaceID, in: path, required: true, schema: {type: string}}
    get:
      tags: [ExecutionProfiles]
      operationId: listExecutionProfiles
      security: [{bearerAuth: []}, {cookieAuth: []}]
      responses:
        "200": {description: Execution profile operation, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/ExecutionProfile"}}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {description: Image registry not configured, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    post:
      tags: [ExecutionProfiles]
      operationId: createExecutionProfile
      security: [{bearerAuth: []}, {cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ExecutionProfileInput"}
      responses:
        "202": {description: Execution profile operation, content: {application/json: {schema: {$ref: "#/components/schemas/ExecutionProfile"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {description: Image registry not configured, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /api/organizations/{orgID}/workspaces/{workspaceID}/execution-profiles/{profileID}:
    parameters:
      - {name: orgID, in: path, required: true, schema: {type: string}}
      - {name: workspaceID, in: path, required: true, schema: {type: string}}
      - {name: profileID, in: path, required: true, schema: {type: string}}
    put:
      tags: [ExecutionProfiles]
      operationId: updateExecutionProfile
      security: [{bearerAuth: []}, {cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ExecutionProfileInput"}
      responses:
        "202": {description: Execution profile operation, content: {application/json: {schema: {$ref: "#/components/schemas/ExecutionProfile"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {description: Image registry not configured, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /api/organizations/{orgID}/workspaces/{workspaceID}/execution-profiles/{profileID}/builds:
    parameters:
      - {name: orgID, in: path, required: true, schema: {type: string}}
      - {name: workspaceID, in: path, required: true, schema: {type: string}}
      - {name: profileID, in: path, required: true, schema: {type: string}}
    get:
      tags: [ExecutionProfiles]
      operationId: listExecutionProfileBuilds
      security: [{bearerAuth: []}, {cookieAuth: []}]
      responses:
        "200": {description: Execution profile operation, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/ExecutionProfileBuild"}}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/coding-providers:
    get:
      tags: [CodingIntegrations]
      operationId: listCodingProviders
      security: [{bearerAuth: []}, {cookieAuth: []}]
      responses:
        "200": {description: Coding provider catalog, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/CodingProvider"}}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/organizations/{orgID}/workspaces/{workspaceID}/coding-integrations:
    parameters:
      - {name: orgID, in: path, required: true, schema: {type: string}}
      - {name: workspaceID, in: path, required: true, schema: {type: string}}
    get:
      tags: [CodingIntegrations]
      operationId: listCodingIntegrations
      security: [{bearerAuth: []}, {cookieAuth: []}]
      responses:
        "200": {description: Workspace coding integrations, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/CodingIntegration"}}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      tags: [CodingIntegrations]
      operationId: createCodingIntegration
      security: [{bearerAuth: []}, {cookieAuth: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/CodingIntegrationInput"}}}
      responses:
        "201": {description: Coding integration created, content: {application/json: {schema: {$ref: "#/components/schemas/CodingIntegration"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "502": {$ref: "#/components/responses/BadGateway"}
  /api/organizations/{orgID}/workspaces/{workspaceID}/coding-integrations/{integrationID}:
    parameters:
      - {name: orgID, in: path, required: true, schema: {type: string}}
      - {name: workspaceID, in: path, required: true, schema: {type: string}}
      - {name: integrationID, in: path, required: true, schema: {type: string}}
    put:
      tags: [CodingIntegrations]
      operationId: updateCodingIntegration
      security: [{bearerAuth: []}, {cookieAuth: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/CodingIntegrationInput"}}}
      responses:
        "204": {description: Coding integration updated}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "502": {$ref: "#/components/responses/BadGateway"}
    delete:
      tags: [CodingIntegrations]
      operationId: deleteCodingIntegration
      security: [{bearerAuth: []}, {cookieAuth: []}]
      responses:
        "204": {description: Coding integration deleted}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/organizations/{orgID}/workspaces/{workspaceID}/coding-integrations/{integrationID}/validate:
    parameters:
      - {name: orgID, in: path, required: true, schema: {type: string}}
      - {name: workspaceID, in: path, required: true, schema: {type: string}}
      - {name: integrationID, in: path, required: true, schema: {type: string}}
    post:
      tags: [CodingIntegrations]
      operationId: validateCodingIntegration
      security: [{bearerAuth: []}, {cookieAuth: []}]
      responses:
        "200": {description: Saved connection validation succeeded, content: {application/json: {schema: {$ref: "#/components/schemas/CodingIntegrationValidation"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "502": {$ref: "#/components/responses/BadGateway"}
  /api/organizations/{orgID}/workspaces/{workspaceID}/coding-integrations/{integrationID}/repositories:
    parameters:
      - {name: orgID, in: path, required: true, schema: {type: string}}
      - {name: workspaceID, in: path, required: true, schema: {type: string}}
      - {name: integrationID, in: path, required: true, schema: {type: string}}
      - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
      - {name: perPage, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
    get:
      tags: [CodingIntegrations]
      operationId: browseCodingRepositories
      security: [{bearerAuth: []}, {cookieAuth: []}]
      responses:
        "200": {description: Provider repository page, content: {application/json: {schema: {$ref: "#/components/schemas/CodingRepositoryPage"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "502": {$ref: "#/components/responses/BadGateway"}
  /healthz:
    get:
      tags: [System]
      operationId: getHealth
      summary: Process liveness (does not check database or runtime readiness)
      responses:
        "200":
          description: HTTP process is running
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
  /auth/login:
    get:
      tags: [Authentication]
      operationId: startLogin
      summary: Redirect to Keycloak for sign-in
      responses:
        "302":
          description: Redirect to the OIDC provider
  /auth/callback:
    get:
      tags: [Authentication]
      operationId: completeLogin
      summary: Complete Keycloak authorization code login
      responses:
        "303":
          description: Login succeeded and an HTTP-only session cookie was set
        "400":
          description: Invalid login state
        "401":
          description: Token exchange or validation failed
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Clear the local session cookie
      responses:
        "204":
          description: Session cleared
  /api/me:
    get:
      tags: [Users]
      operationId: getCurrentUser
      summary: Return the authenticated Keycloak identity
      security: [{bearerAuth: []}, {cookieAuth: []}]
      responses:
        "200":
          description: Internal user profile and organization memberships
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/organizations:
    get:
      tags: [Organizations]
      operationId: listOrganizations
      security: [{bearerAuth: []}, {cookieAuth: []}]
      responses:
        "200": {description: Organizations the user belongs to, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Organization"}}}}}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Organizations]
      operationId: createOrganization
      security: [{bearerAuth: []}, {cookieAuth: []}]
      requestBody: {$ref: "#/components/requestBodies/NamedResource"}
      responses:
        "201": {description: Organization created; creator is Owner, content: {application/json: {schema: {$ref: "#/components/schemas/Organization"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/organizations/{orgID}:
    parameters:
      - {name: orgID, in: path, required: true, schema: {type: string}}
    get:
      tags: [Organizations]
      operationId: getOrganization
      security: [{bearerAuth: []}, {cookieAuth: []}]
      responses:
        "200": {description: Organization, content: {application/json: {schema: {$ref: "#/components/schemas/Organization"}}}}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      tags: [Organizations]
      operationId: updateOrganization
      security: [{bearerAuth: []}, {cookieAuth: []}]
      requestBody: {$ref: "#/components/requestBodies/NamedResource"}
      responses:
        "200": {description: Updated organization, content: {application/json: {schema: {$ref: "#/components/schemas/Organization"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Organizations]
      operationId: deleteOrganization
      security: [{bearerAuth: []}, {cookieAuth: []}]
      responses:
        "204": {description: Organization deleted}
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    # Membership changes are limited to users registered on a prior login.
  /api/organizations/{orgID}/members:
    parameters:
      - {name: orgID, in: path, required: true, schema: {type: string}}
    get:
      tags: [Organizations]
      operationId: listOrganizationMembers
      security: [{bearerAuth: []}, {cookieAuth: []}]
      responses:
        "200": {description: Organization members, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Membership"}}}}}
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/organizations/{orgID}/members/{userID}:
    parameters:
      - {name: orgID, in: path, required: true, schema: {type: string}}
      - {name: userID, in: path, required: true, schema: {type: string}}
    put:
      tags: [Organizations]
      operationId: setOrganizationMember
      security: [{bearerAuth: []}, {cookieAuth: []}]
      requestBody: {$ref: "#/components/requestBodies/OrganizationRole"}
      responses:
        "200": {description: Membership updated, content: {application/json: {schema: {$ref: "#/components/schemas/OperationStatus"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409": {$ref: "#/components/responses/Conflict"}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Organizations]
      operationId: removeOrganizationMember
      security: [{bearerAuth: []}, {cookieAuth: []}]
      responses:
        "204": {description: Membership removed}
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409": {$ref: "#/components/responses/Conflict"}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/organizations/{orgID}/workspaces:
    parameters:
      - {name: orgID, in: path, required: true, schema: {type: string}}
    get:
      tags: [Workspaces]
      operationId: listWorkspaces
      security: [{bearerAuth: []}, {cookieAuth: []}]
      responses:
        "200": {description: Workspaces accessible to the user, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Workspace"}}}}}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Workspaces]
      operationId: createWorkspace
      security: [{bearerAuth: []}, {cookieAuth: []}]
      requestBody: {$ref: "#/components/requestBodies/NamedResource"}
      responses:
        "201": {description: Workspace created, content: {application/json: {schema: {$ref: "#/components/schemas/Workspace"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/organizations/{orgID}/workspaces/{workspaceID}:
    parameters:
      - {name: orgID, in: path, required: true, schema: {type: string}}
      - {name: workspaceID, in: path, required: true, schema: {type: string}}
    get:
      tags: [Workspaces]
      operationId: getWorkspace
      security: [{bearerAuth: []}, {cookieAuth: []}]
      responses:
        "200": {description: Workspace, content: {application/json: {schema: {$ref: "#/components/schemas/Workspace"}}}}
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      tags: [Workspaces]
      operationId: updateWorkspace
      security: [{bearerAuth: []}, {cookieAuth: []}]
      requestBody: {$ref: "#/components/requestBodies/NamedResource"}
      responses:
        "200": {description: Updated workspace, content: {application/json: {schema: {$ref: "#/components/schemas/Workspace"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Workspaces]
      operationId: deleteWorkspace
      security: [{bearerAuth: []}, {cookieAuth: []}]
      responses:
        "204": {description: Workspace deleted}
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/organizations/{orgID}/workspaces/{workspaceID}/members:
    parameters:
      - {name: orgID, in: path, required: true, schema: {type: string}}
      - {name: workspaceID, in: path, required: true, schema: {type: string}}
    get:
      tags: [Workspaces]
      operationId: listWorkspaceMembers
      security: [{bearerAuth: []}, {cookieAuth: []}]
      responses:
        "200": {description: Workspace members, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Membership"}}}}}
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/organizations/{orgID}/workspaces/{workspaceID}/environment:
    parameters:
      - {name: orgID, in: path, required: true, schema: {type: string}}
      - {name: workspaceID, in: path, required: true, schema: {type: string}}
    get:
      tags: [WorkspaceEnvironment]
      operationId: listWorkspaceEnvironment
      security: [{bearerAuth: []}, {cookieAuth: []}]
      responses:
        "200": {description: Variables are returned with values; secrets return only their names and secret status, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/WorkspaceEnvironmentValue"}}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalServerError"}
  /api/organizations/{orgID}/workspaces/{workspaceID}/environment/{name}:
    parameters:
      - {name: orgID, in: path, required: true, schema: {type: string}}
      - {name: workspaceID, in: path, required: true, schema: {type: string}}
      - {name: name, in: path, required: true, schema: {type: string, pattern: '^[A-Za-z_][A-Za-z0-9_]*$'}}
    put:
      tags: [WorkspaceEnvironment]
      operationId: putWorkspaceEnvironment

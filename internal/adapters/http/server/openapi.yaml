      - {name: orgID, in: path, required: true, schema: {type: string}}
      - {name: workspaceID, in: path, required: true, schema: {type: string}}
      - {name: skillID, in: path, required: true, schema: {type: string}}
    get:
      tags: [Skills]
      operationId: getWorkspaceSkill
      security: [{bearerAuth: []}, {cookieAuth: []}]
      responses: {"200": {description: Skill, content: {application/json: {schema: {$ref: "#/components/schemas/Skill"}}}}, "404": {$ref: "#/components/responses/NotFound"}, "401": {$ref: "#/components/responses/Unauthorized"}, "403": {$ref: "#/components/responses/Forbidden"}, "500": {$ref: "#/components/responses/InternalServerError"}}
    put:
      tags: [Skills]
      operationId: updateWorkspaceSkill
      security: [{bearerAuth: []}, {cookieAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/SkillInput"}}}}
      responses: {"200": {description: Updated skill, content: {application/json: {schema: {$ref: "#/components/schemas/Skill"}}}}, "403": {$ref: "#/components/responses/Forbidden"}, "401": {$ref: "#/components/responses/Unauthorized"}, "404": {$ref: "#/components/responses/NotFound"}, "500": {$ref: "#/components/responses/InternalServerError"}}
    delete:
      tags: [Skills]
      operationId: deleteWorkspaceSkill
      security: [{bearerAuth: []}, {cookieAuth: []}]
      responses: {"204": {description: Deleted skill}, "403": {$ref: "#/components/responses/Forbidden"}, "401": {$ref: "#/components/responses/Unauthorized"}, "404": {$ref: "#/components/responses/NotFound"}, "500": {$ref: "#/components/responses/InternalServerError"}}
  /api/organizations/{orgID}/workspaces/{workspaceID}/tasks/{taskID}/runs/{runID}/queue/resume:
    parameters:
      - {name: orgID, in: path, required: true, schema: {type: string}}
      - {name: workspaceID, in: path, required: true, schema: {type: string}}
      - {name: taskID, in: path, required: true, schema: {type: string}}
      - {name: runID, in: path, required: true, schema: {type: string}}
    post:
      tags: [Tasks]
      operationId: resumeTaskRunQueue
      security: [{bearerAuth: []}, {cookieAuth: []}]
      responses:
        "200": {description: Queue updated}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: Queue unavailable, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /api/organizations/{orgID}/workspaces/{workspaceID}/tasks/{taskID}/runs/{runID}/queue/discard:
    parameters:
      - {name: orgID, in: path, required: true, schema: {type: string}}
      - {name: workspaceID, in: path, required: true, schema: {type: string}}
      - {name: taskID, in: path, required: true, schema: {type: string}}
      - {name: runID, in: path, required: true, schema: {type: string}}
    post:
      tags: [Tasks]
      operationId: discardTaskRunQueue
      security: [{bearerAuth: []}, {cookieAuth: []}]
      responses:
        "200": {description: Queue updated}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: Queue unavailable, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
components:
  requestBodies:
    NamedResource:
      required: true
      content:
        application/json:
          schema: {type: object, required: [name], properties: {name: {type: string, minLength: 1, maxLength: 200}}}
    OrganizationRole:
      required: true
      content:
        application/json:
          schema: {type: object, required: [role], properties: {role: {type: string, enum: [owner, admin, member]}}}
    WorkspaceRole:
      required: true
      content:
        application/json:
          schema: {type: object, required: [role], properties: {role: {type: string, enum: [admin, member, viewer]}}}
    AgentDefinition:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, runtime, provider, model, description, systemPrompt, permissionPolicy]
            properties:
              name: {type: string, minLength: 1, maxLength: 200}
              runtime: {type: string, enum: [opencode, claude-code, codex, github-copilot, kiro]}
              provider: {type: string, minLength: 1, maxLength: 200}
              model: {type: string, minLength: 1, maxLength: 200}
              description: {type: string, maxLength: 2000}
              systemPrompt: {type: string, maxLength: 100000}
              permissionPolicy: {type: string, enum: [ask, autonomous], description: Ask preserves provider approval prompts; autonomous disables interactive approval. Native sandbox behavior varies by provider; task environments remain isolated.}
              executionProfileId: {type: string, description: Profile ID; empty string clears the selection.}
              runtimeProfileId: {type: string, description: Runtime profile ID; empty string uses manual model settings.}
              mcpServerIds: {type: array, uniqueItems: true, items: {type: string}}
              skillIds: {type: array, uniqueItems: true, items: {type: string}}
              configuration: {type: object, description: Runtime environment values; values are write-only and encrypted at rest., writeOnly: true, additionalProperties: {type: string}}
            additionalProperties: false
    MCPServerInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, url]
            additionalProperties: false
            properties:
              name: {type: string, minLength: 1, maxLength: 200}
              url: {type: string, format: uri}
              headers: {type: object, additionalProperties: {type: string}, writeOnly: true}
    CodeRepositoryCreate:
      required: true
      content:
        application/json:
          schema: {$ref: "#/components/schemas/CodeRepositoryCreate"}
    TaskIntegration:
      required: true
      content:
        application/json:
          schema: {$ref: "#/components/schemas/TaskIntegrationInput"}
  responses:
    Unauthorized: {description: Missing or invalid credentials, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    Forbidden: {description: Insufficient role permissions, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    NotFound: {description: Resource is absent or inaccessible, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    BadRequest: {description: Request body or role is invalid, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    Conflict: {description: Operation conflicts with an existing resource or invariant, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    BadGateway: {description: Coding provider rejected the connection or failed to respond, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    SkillInput:
      type: object
      required: [skillMD]
      properties:
        skillMD: {type: string, minLength: 1, maxLength: 100000, description: Complete SKILL.md including required frontmatter}
      additionalProperties: false
    Skill:
      type: object
      required: [id, scope, skillMD, createdAt, updatedAt]
      properties:
        id: {type: string}
        scope: {type: string, enum: [global, organization, workspace]}
        organizationId: {type: string}
        workspaceId: {type: string}
        skillMD: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    Skills:
      type: array
      items: {$ref: "#/components/schemas/Skill"}
    CurrentUser:
      type: object
      required:
        - user
        - organizations
        - platformAdmin
      properties:
        user: {$ref: "#/components/schemas/User"}
        organizations: {type: array, items: {$ref: "#/components/schemas/Organization"}}
        platformAdmin:
          type: boolean
          readOnly: true
    User:
      type: object
      required: [id, username, email]
      properties:
        id: {type: string}
        username: {type: string}
        email: {type: string}
    Organization:
      type: object
      required: [id, name]
      properties:
        id: {type: string}
        name: {type: string}
        role: {type: string, enum: [owner, admin, member]}
    Workspace:
      type: object
      required: [id, organizationId, name]
      properties:
        id: {type: string}
        organizationId: {type: string}
        name: {type: string}
        role: {type: string, enum: [owner, admin, member, viewer]}
    WorkspaceEnvironmentInput:
      type: object
      required: [value]
      properties:
        value: {type: string, maxLength: 65536}
        secret: {type: boolean, default: false}
    WorkspaceEnvironmentValue:
      type: object
      required: [name, secret]
      properties:
        name: {type: string}
        secret: {type: boolean}
        value: {type: string, description: Omitted for secrets}
    Membership:
      type: object
      required: [user, role]
      properties:
        user: {$ref: "#/components/schemas/User"}
        role: {type: string, enum: [owner, admin, member, viewer]}
    ArtifactContent:
      type: object
      additionalProperties: false
      required: [mediaType]
      properties:
        mediaType: {type: string}
        text: {type: string, maxLength: 100000}
        url: {type: string, format: uri, maxLength: 4000}
        metadata: {type: object, additionalProperties: true}
      oneOf:
        - required: [text]
          not: {required: [url]}
        - required: [url]
          not: {required: [text]}
    PublishArtifactInput:
      type: object
      additionalProperties: false
      required: [expectedRevision, idempotencyKey, kind, title, content]
      properties:
        artifactId: {type: string}
        expectedRevision: {type: integer, format: int64, minimum: 0}
        idempotencyKey: {type: string, minLength: 1, maxLength: 200}
        kind: {type: string, pattern: '^[a-z][a-z0-9_.-]{0,99}$'}
        title: {type: string, minLength: 1, maxLength: 500}
        outputName: {type: string}
        content: {$ref: "#/components/schemas/ArtifactContent"}
    ArtifactRevision:
      type: object
      required: [id, artifactId, number, kind, title, content, createdBy, stageId, stageVersion, createdAt]
      properties:
        id: {type: string}
        artifactId: {type: string}
        number: {type: integer, format: int64}
        kind: {type: string}
        title: {type: string}
        outputName: {type: string}
        content: {$ref: "#/components/schemas/ArtifactContent"}
        createdBy: {type: string}
        producingRunId: {type: string}
        stageId: {type: string}
        stageVersion: {type: integer, format: int64}
        createdAt: {type: string, format: date-time}
    ArtifactOutput:
      type: object
      additionalProperties: false
      required: [name, kind]
      properties:
        name: {type: string}
        kind: {type: string}
    ArtifactInput:
      type: object
      additionalProperties: false
      required: [name, sourceStageId, outputName, required]
      properties:
        name: {type: string}
        sourceStageId: {type: string}
        outputName: {type: string}
        required: {type: boolean}
    WorkflowStage:
      type: object
      required: [id, name, description, responsibleAgentId]
      properties:
        artifactInputs: {type: array, maxItems: 50, items: {$ref: "#/components/schemas/ArtifactInput"}}
        artifactOutputs: {type: array, maxItems: 50, items: {$ref: "#/components/schemas/ArtifactOutput"}}
        id: {type: string, minLength: 1, maxLength: 100}
        name: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 2000}
        responsibleAgentId: {type: string}
    WorkflowAutomationRule:
      type: object
      additionalProperties: false
      required: [id, enabled, event, sourceStageId, action]
      properties:
        id: {type: string, minLength: 1, maxLength: 100}
        enabled: {type: boolean}
        event: {type: string, enum: [stage_entered, run_succeeded, stage_completed]}
        sourceStageId: {type: string}
        action: {type: string, enum: [move_task, start_work]}
        targetStageId: {type: string}
    WorkflowInput:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
    WorkspaceWorkflow:
      type: object
      required: [id, name, version, initialStageId, closedStageId, stages, rules]
      properties:
        id: {type: string}
        name: {type: string, minLength: 1, maxLength: 200}
        version: {type: integer, format: int64, minimum: 1}
        initialStageId: {type: string, description: Stage for new tasks; independent of display order.}
        closedStageId: {type: string, description: Closed stage; independent of display order.}
        rules: {type: array, maxItems: 200, items: {$ref: "#/components/schemas/WorkflowAutomationRule"}}
        configuredBy: {type: string, description: User who last configured automation; assigned by the server.}
        stages: {type: array, minItems: 1, maxItems: 50, items: {$ref: "#/components/schemas/WorkflowStage"}}
    TaskTransition:
      type: object
      required: [stageVersion, action, commandId]
      properties:
        stageId: {type: string}
        stageVersion: {type: integer, format: int64, minimum: 1}
        action: {type: string, enum: [move, start, complete]}
        commandId: {type: string, minLength: 1, maxLength: 200}
        sessionMode: {type: string, enum: [continue, new]}
        promptText: {type: string, maxLength: 262144}
    TaskInput:
      type: object
      required: [title]
      properties:
        startWork: {type: boolean, description: Explicitly start another work step after a failed run; active execution conflicts.}
        sessionMode: {type: string, enum: [continue, new], description: Session choice when explicitly starting work. Defaults to a fresh session; continue explicitly to reuse a saved session.}
        promptText: {type: string, maxLength: 262144, description: Optional initial prompt for a user-started work step.}
        commandId: {type: string, maxLength: 200}
        title: {type: string, minLength: 1, maxLength: 500}
        workflowId: {type: string, description: Required when creating a task; immutable after creation.}
        description: {type: string, maxLength: 100000}
        stageVersion: {type: integer, format: int64}
        status: {type: string, description: Stable workspace workflow stage ID}
        assigneeAgentId: {type: string}
        labels: {type: array, items: {type: string}}
        repositoryIds: {type: array, items: {type: string}}
      additionalProperties: false
    Task:
      type: object
      required: [id, workspaceId, workflowId, title, description, sourceProvider, status, labels, repositories, createdAt, updatedAt]
      properties:
        id: {type: string}
        workspaceId: {type: string}
        workflowId: {type: string}
        title: {type: string}
        description: {type: string}
        sourceProvider: {type: string}
        sourceId: {type: string}
        sourceUrl:
          type: string
          description: Source link, possibly empty for draft items.
        stageVersion: {type: integer, format: int64}
        automationPending: {type: boolean, description: A durable automation event is waiting to be processed.}
        stageWorkState: {$ref: "#/components/schemas/StageWorkState"}
        closed: {type: boolean}
        status: {type: string, description: Stable workspace workflow stage ID}
        assigneeAgentId: {type: string}
        labels: {type: array, items: {type: string}}
        repositories: {type: array, items: {$ref: "#/components/schemas/TaskRepository"}}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    StageWorkState:
      type: string
      enum: [idle, queued, running, completed, failed]
    TaskRepository:
      type: object
      required: [id, providerName, name, url]
      properties:
        id: {type: string}
        providerName: {type: string}
        name: {type: string}
        url: {type: string, format: uri}
    TaskComment:
      type: object
      required: [id, workspaceId, taskId, authorUserId, body, createdAt]
      properties:
        id: {type: string}
        workspaceId: {type: string}
        taskId: {type: string}
        authorUserId: {type: string}
        body: {type: string, maxLength: 20000}
        createdAt: {type: string, format: date-time}
    TaskRun:
      type: object
      required: [runId, taskId, status, lastSequence, updatedAt]
      properties:
        executionImage: {type: string}
        recoveryBlocked: {type: boolean}
        executionState: {type: string}
        queuePaused: {type: boolean}
        queueDepth: {type: integer, minimum: 0}
        runId: {type: string}
        taskSessionId: {type: string}
        taskId: {type: string}
        status: {type: string}
        failureStage: {type: string}
        failureReason: {type: string}
        lastSequence: {type: integer, minimum: 0}
        updatedAt: {type: string, format: date-time}
    DirectAgentConversation:
      type: object
      required: [id, agentId, createdAt]
      properties:
        id: {type: string}
        agentId: {type: string}
        createdAt: {type: string, format: date-time}
    TaskRunEvent:
      type: object
      required: [runId, sequence, payload]
      properties:
        runId: {type: string}
        sequence: {type: integer, minimum: 1}
        payload: {type: object, additionalProperties: true}
    ExecutionProfileInput:
      type: object
      required: [name, description, runtime, toolchainImage]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 2000}
        runtime: {type: string, enum: [opencode, claude-code, codex, github-copilot, kiro]}
        toolchainImage: {type: string, minLength: 1}
        generation: {type: integer, format: int64, minimum: 0}
    ExecutionProfile:
      allOf:
        - {$ref: "#/components/schemas/ExecutionProfileInput"}
        - type: object
          required: [id, workspaceId, generation, status, executionImage, buildError, createdAt, updatedAt]
          properties:
            id: {type: string}
            workspaceId: {type: string}
            generation: {type: integer, format: int64}
            status: {type: string}
            executionImage: {type: string}
            buildError: {type: string}
            createdAt: {type: string, format: date-time}
            updatedAt: {type: string, format: date-time}
    ExecutionProfileBuild:
      type: object
      required: [id, profileId, workspaceId, generation, runtime, toolchainImage, baseImage, destination, status, executionImage, buildError, createdAt]
      properties:
        id: {type: string}
        profileId: {type: string}
        workspaceId: {type: string}
        generation: {type: integer, format: int64}
        runtime: {type: string, enum: [opencode, claude-code, codex, github-copilot, kiro]}
        toolchainImage: {type: string}
        baseImage: {type: string}
        runtimeVersion: {type: string}
        resolvedToolchain: {type: string}
        resolvedBase: {type: string}
        destination: {type: string}
        status: {type: string}
        executionImage: {type: string}
        buildError: {type: string}
        createdAt: {type: string, format: date-time}
    Agent:
      type: object
      required: [id, workspaceId, name, runtime, provider, model, description, systemPrompt, permissionPolicy, mcpServerIds, skillIds, hasConfiguration]
      properties:
        executionProfileId: {type: string}
        runtimeProfileId: {type: string}
        id: {type: string}
        workspaceId: {type: string}
        name: {type: string}
        runtime: {type: string, enum: [opencode, claude-code, codex, github-copilot, kiro]}
        provider: {type: string}
        model: {type: string}
        description: {type: string}
        systemPrompt: {type: string}
        permissionPolicy: {type: string, enum: [ask, autonomous]}
        mcpServerIds: {type: array, items: {type: string}}
        skillIds: {type: array, items: {type: string}}
        hasConfiguration: {type: boolean}
    AgentRuntimeProfileInput:
      type: object
      required: [name, runtime, modelProvider, modelIdentifier]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        runtime: {type: string, enum: [opencode, claude-code, codex, github-copilot, kiro]}
        modelProvider: {type: string, minLength: 1, maxLength: 200}
        modelIdentifier: {type: string, minLength: 1, maxLength: 200}
        configuration: {type: object, description: Runtime environment values; values are write-only and encrypted at rest., writeOnly: true, additionalProperties: {type: string}}
    AgentRuntimeProfile:
      allOf:
        - {$ref: "#/components/schemas/AgentRuntimeProfileInput"}
        - type: object
          required: [id, workspaceId, createdAt, updatedAt]
          properties:
            id: {type: string}
            workspaceId: {type: string}
            createdAt: {type: string, format: date-time}
            updatedAt: {type: string, format: date-time}
            hasConfiguration: {type: boolean}
    RuntimeProvider:
      type: object
      required: [runtime, configuration]
      properties:
        runtime: {type: string, enum: [opencode, claude-code, codex, github-copilot, kiro]}
        configuration: {type: array, items: {$ref: "#/components/schemas/RuntimeConfigurationOption"}}
    RuntimeConfigurationOption:
      type: object
      required: [name, description, required, sensitive]
      properties:
        name: {type: string}
        description: {type: string}
        required: {type: boolean}
        sensitive: {type: boolean}
    MCPServer:
      type: object
      required: [id, workspaceId, name, url, hasHeaders]
      properties:
        id: {type: string}
        workspaceId: {type: string}
        name: {type: string}
        url: {type: string, format: uri}
        hasHeaders: {type: boolean}
    CodeRepository:
      type: object
      required: [id, workspaceId, providerName, url, defaultBranch, private]
      properties:
        id: {type: string}
        workspaceId: {type: string}
        providerName: {type: string, enum: [github, gitlab_cloud, gitlab_server]}
        url: {type: string, format: uri}
        integrationId: {type: string}
        providerRepositoryId: {type: string}
        defaultBranch: {type: string}
        name: {type: string}
        private: {type: boolean}
    CodingIntegrationInput:
      type: object
      required: [name, providerName]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        providerName: {type: string, enum: [github, gitlab_cloud, gitlab_server]}
        providerConfig: {type: object, additionalProperties: true}
        credential: {type: string, writeOnly: true}
      additionalProperties: false
    CodingIntegration:
      type: object
      required: [id, workspaceId, name, providerName, providerConfig]
      properties:
        id: {type: string}
        workspaceId: {type: string}
        name: {type: string}
        providerName: {type: string, enum: [github, gitlab_cloud, gitlab_server]}
        providerConfig: {type: object, additionalProperties: true}
        updatedAt: {type: string}
    CodingProvider:
      type: object
      required: [providerName, configSchema]
      properties:
        providerName: {type: string, enum: [github, gitlab_cloud, gitlab_server]}
        configSchema: {type: object, additionalProperties: true}
    CodingRepository:
      type: object
      required: [id, name, cloneUrl, private, defaultBranch]
      properties:
        id: {type: string}
        name: {type: string}
        cloneUrl: {type: string, format: uri}
        private: {type: boolean}
        defaultBranch: {type: string}
    CodingRepositoryPage:
      type: object
      required: [repositories]
      properties:
        repositories: {type: array, items: {$ref: "#/components/schemas/CodingRepository"}}
        nextPage: {type: integer}
    CodingIntegrationValidation:
      type: object
      required: [connected]
      properties:
        connected: {type: boolean}
    CodeRepositoryCreate:
      type: object
      required: [integrationId, providerRepositoryId]
      additionalProperties: false
      properties:
        integrationId: {type: string}
        providerRepositoryId: {type: string}
    TaskIntegrationInput:
      type: object
      required: [workflowId, provider, name, config]
      properties:
        workflowId: {type: string}
        provider: {type: string}
        name: {type: string, minLength: 1, maxLength: 200}
        enabled: {type: boolean}
        config: {$ref: "#/components/schemas/TaskIntegrationConfig"}
        labels: {type: array, items: {type: string}}
        interval: {type: string, example: 5m}
        credential: {type: string, writeOnly: true}
      additionalProperties: false
    TaskIntegration:
      type: object
      required: [id, workspaceId, workflowId, provider, name, enabled, config, labels, interval, createdAt, updatedAt]
      properties:
        id: {type: string}
        workspaceId: {type: string}
        workflowId: {type: string}
        provider: {type: string}
        name: {type: string}
        enabled: {type: boolean}
        config: {$ref: "#/components/schemas/TaskIntegrationConfig"}
        labels: {type: array, items: {type: string}}
        interval: {type: string}
        lastSynced: {type: string, format: date-time}
        lastError: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    TaskIntegrationConfig:
      type: object
      description: Provider-defined config. Retrieve allowed fields and constraints from GET /api/task-integration-providers.
      additionalProperties: true
    TaskIntegrationProvider:
      type: object
      required: [provider, configSchema]
      properties:
        provider: {type: string}
        configSchema:
          type: object
          description: JSON Schema that validates the provider-specific TaskIntegrationInput config.
          additionalProperties: true
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
    OperationStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string

openapi: 3.1.0
info:
  title: Orkest agentctl API
  version: 0.1.0
  description: Standalone process-local control API. REST commands and status; receive-only WebSocket activity with private journaling and reconnect replay. Application failures, including request decoding and pre-upgrade validation, use Error. Router and WebSocket library rejections retain their native responses. Durable task sessions support explicit restoration and queued prompts.
servers:
  - url: /
paths:
  /health:
    get:
      operationId: agentctlHealth
      summary: Process liveness; does not check agent readiness
      responses:
        "200":
          description: Process is running
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }
  /info:
    get:
      operationId: agentctlInfo
      summary: Process metadata and execution availability; excludes configuration and credentials
      responses:
        "200":
          description: Runtime information
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Info" }
  /agent/configure:
    post:
      operationId: configureAgent
      summary: Bind the process to one run without starting execution
      description: Identical requests are idempotent. Any different configuration conflicts. Durable task-session configuration is saved privately for restart recovery.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunConfig" }
      responses:
        "200":
          description: Configured successfully
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [configured] }
        "400":
          description: Unreadable body, invalid JSON, or missing values
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Already bound to a different configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: Request body exceeds 1 MiB
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Runtime does not match the wired provider
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: Content-Type must be application/json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Unexpected service failure; internal details are not exposed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /agent/launch:
    post:
      operationId: launchAgent
      summary: Explicitly launch the configured provider and create a session without prompting
      description: Service-owned startup survives request disconnection. One attempt per process/run; repeated or failed attempts are not retried. Shutdown closes the owned provider.
      responses:
        "200":
          description: Provider session ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Info" }
        "409":
          description: Not configured or launch already attempted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: Provider startup failed; message contains a sanitized provider error.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: No provider available
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /agent/restore:
    post:
      operationId: restoreAgent
      summary: Restore the configured durable session without creating a replacement
      responses:
        "200": {description: Session restored, content: {application/json: {schema: {$ref: "#/components/schemas/Info"}}}}
        "409": {description: Not configured or execution still owned, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "502": {description: Restoration failed; original session retained, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "503": {description: Restoration unsupported or storage unavailable, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /agent/commands/{commandID}:
    get:
      operationId: agentCommandStatus
      parameters:
        - {name: commandID, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: Durable command status, content: {application/json: {schema: {type: object, required: [commandId, status], properties: {commandId: {type: string}, status: {type: string, enum: [queued, running, completed, failed, interrupted, discarded]}}}}}}
        "400": {description: Unknown command, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "503": {description: Lookup unavailable, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /agent/queue/resume:
    post:
      operationId: resumeAgentQueue
      summary: Explicitly resume paused pending prompts
      responses:
        "200": {description: Queue updated, content: {application/json: {schema: {$ref: "#/components/schemas/Info"}}}}
        "409": {description: Queue unavailable, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "503": {description: Queue control or storage unavailable, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /agent/queue/discard:
    post:
      operationId: discardAgentQueue
      summary: Explicitly discard paused pending prompts
      responses:
        "200": {description: Queue updated, content: {application/json: {schema: {$ref: "#/components/schemas/Info"}}}}
        "409": {description: Queue unavailable, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "503": {description: Queue control or storage unavailable, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /agent/prompt:
    post:
      operationId: promptAgent
      summary: Accept an explicit prompt independently of stream connections
      description: Durable sessions queue follow-ups in FIFO order, with one executing prompt. Legacy configurations reject overlapping prompts. Same commandId and text is idempotent while available; changed text is rejected. At most 4096 identities and 256 KiB of UTF-8 text per prompt. Acceptance is durable before execution; it is not completion. Events can arrive before the HTTP response.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PromptRequest" }
      responses:
        "202":
          description: Prompt accepted, or identical prior command already accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandResponse" }
        "400":
          description: Invalid command identity/text or conflicting reuse of identity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Conversation unavailable/busy/interrupted or command limit reached
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: Request body exceeds 1 MiB
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: Content-Type must be application/json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Conversation storage unavailable; reconciliation required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Unexpected service failure; internal details are not exposed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /agent/cancel:
    post:
      operationId: cancelAgentPrompt
      summary: Request cancellation of the active command
      description: Delivery acknowledgement is not proof of completion. Observe a terminal event before treating execution as ended. Failed delivery leaves the conversation interrupted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CancelRequest" }
      responses:
        "202":
          description: Cancellation delivery requested
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandResponse" }
        "400":
          description: Missing, stale, or mismatched command identity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Conversation unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: Request body exceeds 1 MiB
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: Content-Type must be application/json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: Cancellation delivery failed; outcome uncertain
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Conversation storage unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Unexpected service failure; internal details are not exposed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /agent/questions/respond:
    post:
      tags: [Agent]
      operationId: respondQuestion
      summary: Durably record an answer for the original pending question
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/QuestionResponse"}
      responses:
        "200": {description: Answer recorded, content: {application/json: {schema: {$ref: "#/components/schemas/CommandResponse"}}}}
        "400": {description: Answer fails the form schema}
        "409": {description: "Stale, conflicting, closed, or mismatched question"}
  /agent/permissions/respond:
    post:
      operationId: respondAgentPermission
      summary: Record an explicit response to a pending permission
      description: Binds the offered option to task/run/session/request identities. Duplicate, stale, and unoffered answers are rejected. A recorded response is delivery intent, not proof the runtime accepted it. No automatic approval.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PermissionResponse" }
      responses:
        "200":
          description: Permission response recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandResponse" }
        "400":
          description: Invalid JSON
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Invalid, stale, duplicate, or unoffered permission response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: Request body exceeds 1 MiB
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: Content-Type must be application/json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Conversation storage unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Unexpected service failure; internal details are not exposed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /agent/stream:
    get:
      operationId: streamAgent
      summary: Receive-only WebSocket for readiness and ordered activity
      description: |
        Requires configuration before upgrading. Default same-origin checks apply.
        Server first sends {"type":"ready","info":Info}, followed by
        {"type":"event","event":ConversationEvent} replay and live frames.
        Commands use the REST endpoints, never this stream. All client application
        messages close the connection with status 1008. Protocol ping/pong and close
        frames remain supported. Read current status through GET /info.
        Disconnect leaves execution and pending permissions running. afterSequence selects
        events after the last processed sequence. Replay retains at most 4096 events
        in memory. Durable sessions replay older committed cursors from disk;
        legacy configurations reject expired cursors. Event size is not capped.
        Invalid, expired, or future cursors return 400 with errorCode invalid_cursor.
        Slow subscribers are detached without stopping work. Events are synced to private
        storage before streaming. Durable task sessions support explicit restoration and queued prompts.
        Server shutdown closes streams; agentctl shutdown closes its owned provider.
      parameters:
        - in: query
          name: afterSequence
          schema: { type: integer, minimum: 0, default: 0 }
          description: Last processed event sequence; the client owns this cursor.
      x-websocket-server-message: { $ref: "#/components/schemas/ServerMessage" }
      responses:
        "101": { description: WebSocket connection established }
        "400":
          description: Invalid upgrade request or invalid/expired replay cursor. Cursor errors use Error; upgrade failures use the WebSocket library response.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { description: WebSocket origin rejected }
        "409":
          description: Agent has not been configured or conversation unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "426": { description: Unsupported WebSocket version }
        "500":
          description: Unexpected service failure; internal details are not exposed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
components:
  schemas:
    Error:
      type: object
      required: [errorCode, error]
      properties:
        error: { type: string }
        errorCode:
          type: string
          enum:
            [
              invalid_configuration,
              configuration_conflict,
              not_configured,
              launch_conflict,
              provider_unavailable,
              launch_failed,
              invalid_command,
              invalid_question,
              invalid_answer,
              invalid_permission,
              conversation_unavailable,
              conversation_busy,
              conversation_interrupted,
              command_limit,
              cancellation_failed,
              storage_unavailable,
              invalid_cursor,
              invalid_json,
              unreadable_body,
              body_too_large,
              unsupported_media_type,
              internal_error,
            ]
        field:
          type: string
          description: Missing configuration field name; never includes the supplied value.
    RunConfig:
      type: object
      additionalProperties: true
      required:
        [
          organizationId,
          workspaceId,
          taskId,
          runId,
          runtime,
          agent,
          model,
        ]
      properties:
        organizationId: { type: string, pattern: '\S' }
        workspaceId: { type: string, pattern: '\S' }
        taskId: { type: string, pattern: '\S' }
        taskSessionId: { type: string }
        restoreSession: { type: boolean, default: false }
        gitCredentialsRequired: { type: boolean, default: false }
        gitCredentials:
          type: array
          description: Sensitive HTTPS Git credentials scoped to a repository or workspace provider URL prefix; never returned by the API.
          items:
            type: object
            additionalProperties: false
            required: [repositoryUrl, repositoryPath, token]
            properties:
              repositoryUrl: { type: string, format: uri }
              repositoryPath: { type: string, description: "Checkout path for a repository grant; empty for a workspace provider URL prefix." }
              token: { type: string, writeOnly: true }
        mcpServers:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name, url]
            description: Omitted transport means HTTP. HTTP requires URL and accepts headers; stdio requires an absolute executable and accepts literal arguments and environment. The runtime launches stdio servers inside the execution environment.
            properties:
              id: {type: string}
              name: {type: string}
              transport: {type: string, enum: [http, stdio]}
              url: {type: string, description: Empty for stdio.}
              headers: {type: object, additionalProperties: {type: string}, writeOnly: true}
              command: {type: string, pattern: '^/'}
              args: {type: array, items: {type: string}}
              environment: {type: object, additionalProperties: {type: string}, writeOnly: true}
        runId: { type: string, pattern: '\S' }
        runtime: { type: string, enum: [opencode, claude-code, codex, github-copilot, kiro] }
        agent:
          type: object
          additionalProperties: false
          required: [name, description, instructions]
          properties:
            name: { type: string, pattern: '\S' }
            description: { type: string }
            instructions: { type: string, pattern: '\S' }
        model:
          type: object
          additionalProperties: true
          required: [provider, id]
          properties:
            provider: { type: string, pattern: '\S' }
            id: { type: string, pattern: '\S' }
        skills:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, skillMD]
            properties:
              id: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
              skillMD: { type: string, pattern: '\S' }
    Info:
      type: object
      required:
        [
          service,
          apiVersion,
          goVersion,
          os,
          arch,
          startedAt,
          configured,
          executionAvailable,
          processAlive,
        ]
      properties:
        organizationId: { type: string }
        workspaceId: { type: string }
        taskId: { type: string }
        runId: { type: string }
        service: { type: string, enum: [agentctl] }
        apiVersion: { type: string, enum: [v1] }
        goVersion: { type: string }
        os: { type: string }
        arch: { type: string }
        startedAt: { type: string, format: date-time }
        configured: { type: boolean }
        executionAvailable: { type: boolean }
        state:
          {
            type: string,
            enum:
              [
                starting,
                ready,
                running,
                waiting_for_input,
                waiting_for_permission,
                failed,
                interrupted,
                exited,
              ],
          }
        processAlive:
          type: boolean
          description: Provider process liveness, independent of execution state. Interrupted/failed states survive process exit.
        sessionId: { type: string }
        taskSessionId: { type: string }
        activeCommand: { type: string }
        queueDepth: { type: integer, minimum: 0 }
        queuePaused: { type: boolean }
        runEnded: { type: boolean }
        recoveryBlocked:
          type: boolean
          description: Saved state or runtime restoration requires reconciliation. Can be true before configuration is available; execution is unavailable and conflicting configuration or launch returns recovery_blocked. Process liveness remains independent.

    PromptRequest:
      type: object
      required: [commandId, text]
      properties:
        commandId:
          type: string
          pattern: '\S'
          description: Stable identity, at most 200 UTF-8 bytes.
        text:
          type: string
          pattern: '\S'
          description: At most 262144 UTF-8 bytes.
    CancelRequest:
      type: object
      required: [commandId]
      properties:
        commandId: { type: string }
    CommandResponse:
      type: object
      required: [status]
      properties:
        status:
          { enum: [accepted, cancel_requested, permission_response_recorded, question_answer_recorded] }
        commandId: { type: string }
        requestId:
          {
            type: string,
            description: Permission request identity for a recorded response,
          }
    Question:
      type: object
      required: [message, schema]
      properties:
        toolCallId: {type: string}
        message: {type: string}
        schema: {type: object, additionalProperties: true}
    QuestionAnswer:
      type: object
      required: [action]
      properties:
        action: {type: string, enum: [accept, decline, cancel]}
        content: {type: object, additionalProperties: true}
    QuestionResponse:
      type: object
      required: [taskId, taskSessionId, runId, sessionId, commandId, requestId, submissionId, answer]
      properties:
        taskId: {type: string}
        taskSessionId: {type: string}
        runId: {type: string}
        sessionId: {type: string}
        commandId: {type: string}
        requestId: {type: string}
        answeredBy: {type: string, description: Human actor recorded by the platform}
        submissionId: {type: string, minLength: 1, maxLength: 200}
        answer: {$ref: "#/components/schemas/QuestionAnswer"}
    PermissionResponse:
      type: object
      required: [taskId, runId, sessionId, requestId, optionId]
      properties:
        taskId: { type: string }
        runId: { type: string }
        sessionId: { type: string }
        requestId: { type: string }
        optionId: { type: string }
    Permission:
      type: object
      required: [toolCallId, title, options]
      properties:
        toolCallId: { type: string }
        title: { type: string }
        options:
          type: array
          items:
            type: object
            required: [id, name, kind]
            properties:
              id: { type: string }
              name: { type: string }
              kind: { type: string }
    ConversationEvent:
      type: object
      required:
        [
          sequence,
          at,
          type,
          organizationId,
          workspaceId,
          taskId,
          runId,
          sessionId,
        ]
      properties:
        sequence: { type: integer, minimum: 1 }
        at: { type: string, format: date-time }
        type:
          enum:
            [
              prompt_accepted,
              prompt_started,
              prompt_interrupted,
              queue_paused,
              queue_resumed,
              queue_discarded,
              run_completed,
              run_failed,
              prompt_continued,
              session_restored,
              runtime_stopped,
              update,
              question_requested,
              question_answered,
              question_cancelled,
              question_delivery_uncertain,
              permission_requested,
              permission_response,
              cancel_requested,
              prompt_completed,
              prompt_failed,
            ]
        organizationId: { type: string }
        workspaceId: { type: string }
        taskId: { type: string }
        runId: { type: string }
        sessionId: { type: string }
        taskSessionId: { type: string }
        commandId: { type: string }
        requestId: { type: string }
        text: { type: string }
        stopReason: { type: string }
        error: { type: string }
        permission: { $ref: "#/components/schemas/Permission" }
        question: {$ref: "#/components/schemas/Question"}
        questionResponse: {$ref: "#/components/schemas/QuestionResponse"}
        update:
          type: object
          required: [kind]
          properties:
            kind: { enum: [text, tool_call, tool_call_update] }
            text: { type: string }
            toolCallId: { type: string }
            title: { type: string }
            status: { type: string }
            toolKind: { type: string }
            input: { type: string, description: Bounded input preview }
            output: { type: string, description: Bounded output preview }
            truncated: { type: boolean }
            locations:
              type: array
              items:
                type: object
                properties:
                  path: { type: string }
                  line: { type: integer }
            content:
              type: array
              items:
                type: object
                properties:
                  kind: { enum: [text, diff, unsupported] }
                  path: { type: string }
                  text: { type: string }
                  oldText: { type: string }
                  newText: { type: string }
                  truncated: { type: boolean }
    ServerMessage:
      type: object
      required: [type]
      properties:
        type: { enum: [ready, event] }
        info: { $ref: "#/components/schemas/Info" }
        event: { $ref: "#/components/schemas/ConversationEvent" }

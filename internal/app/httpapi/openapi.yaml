components:
  requestBodies:
    NamedResource:
      required: true
      content:
        application/json:
          schema: {type: object, required: [name], properties: {name: {type: string, minLength: 1, maxLength: 200}}}
    OrganizationRole:
      required: true
      content:
        application/json:
          schema: {type: object, required: [role], properties: {role: {type: string, enum: [owner, admin, member]}}}
    WorkspaceRole:
      required: true
      content:
        application/json:
          schema: {type: object, required: [role], properties: {role: {type: string, enum: [admin, member, viewer]}}}
    AgentDefinition:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, runtime, provider, model, description, systemPrompt]
            properties:
              name: {type: string, minLength: 1, maxLength: 200}
              runtime: {type: string, enum: [opencode]}
              provider: {type: string, minLength: 1, maxLength: 200}
              model: {type: string, minLength: 1, maxLength: 200}
              description: {type: string, maxLength: 2000}
              systemPrompt: {type: string, maxLength: 100000}
              mcpServerIds: {type: array, uniqueItems: true, items: {type: string}}
              skillIds: {type: array, uniqueItems: true, items: {type: string}}
    MCPServerInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, url]
            additionalProperties: false
            properties:
              name: {type: string, minLength: 1, maxLength: 200}
              url: {type: string, format: uri}
              headers: {type: object, additionalProperties: {type: string}, writeOnly: true}
    CodeRepositoryCreate:
      required: true
      content:
        application/json:
          schema: {$ref: "#/components/schemas/CodeRepositoryCreate"}
    TaskIntegration:
      required: true
      content:
        application/json:
          schema: {$ref: "#/components/schemas/TaskIntegrationInput"}
  responses:
    Unauthorized: {description: Missing or invalid credentials}
    Forbidden: {description: Insufficient role permissions}
    NotFound: {description: Resource is absent or inaccessible}
    BadRequest: {description: Request body or role is invalid}
    Conflict: {description: Operation conflicts with membership invariants}
  schemas:
    SkillInput:
      type: object
      required: [skillMD]
      properties:
        skillMD: {type: string, minLength: 1, maxLength: 100000, description: Complete SKILL.md including required frontmatter}
    Skill:
      type: object
      required: [id, scope, skillMD, createdAt, updatedAt]
      properties:
        id: {type: string}
        scope: {type: string, enum: [global, organization, workspace]}
        organizationId: {type: string}
        workspaceId: {type: string}
        skillMD: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    Skills:
      type: array
      items: {$ref: "#/components/schemas/Skill"}
    TempAgentLaunchRequest:
      type: object
      additionalProperties: false
      required: [config, commandId, prompt]
      properties:
        config:
          type: object
          required: [organizationId, workspaceId, taskId, runId, runtime, model, agent]
          properties:
            organizationId: {type: string, minLength: 1}
            workspaceId: {type: string, minLength: 1}
            taskId: {type: string, minLength: 1}
            runId: {type: string, minLength: 1}
            runtime: {type: string, enum: [opencode]}
            model:
              type: object
              required: [provider, id]
              properties:
                provider: {type: string, minLength: 1}
                id: {type: string, minLength: 1}
            agent:
              type: object
              additionalProperties: false
              required: [name, description, instructions]
              properties:
                name: {type: string, minLength: 1}
                description: {type: string}
                instructions: {type: string, minLength: 1}
        commandId: {type: string, minLength: 1}
        prompt: {type: string, minLength: 1}
    CurrentUser:
      type: object
      required: [user, organizations]
      properties:
        user: {$ref: "#/components/schemas/User"}
        organizations: {type: array, items: {$ref: "#/components/schemas/Organization"}}
    User:
      type: object
      required: [id, username, email]
      properties:
        id: {type: string}
        username: {type: string}
        email: {type: string}
    Organization:
      type: object
      required: [id, name]
      properties:
        id: {type: string}
        name: {type: string}
        role: {type: string, enum: [owner, admin, member]}
    Workspace:
      type: object
      required: [id, organizationId, name]
      properties:
        id: {type: string}
        organizationId: {type: string}
        name: {type: string}
        role: {type: string, enum: [owner, admin, member, viewer]}
    Membership:
      type: object
      required: [user, role]
      properties:
        user: {$ref: "#/components/schemas/User"}
        role: {type: string, enum: [owner, admin, member, viewer]}
    TaskInput:
      type: object
      required: [title]
      properties:
        title: {type: string, minLength: 1, maxLength: 500}
        description: {type: string}
        status: {type: string, enum: [todo, in_progress, in_review, done]}
        assigneeAgentId: {type: string}
        labels: {type: array, items: {type: string}}
        componentIds: {type: array, items: {type: string}}
    Task:
      type: object
      required: [id, workspaceId, title, description, sourceProvider, status, labels, components, createdAt, updatedAt]
      properties:
        id: {type: string}
        workspaceId: {type: string}
        title: {type: string}
        description: {type: string}
        sourceProvider: {type: string}
        sourceId: {type: string}
        sourceUrl: {type: string, format: uri}
        status: {type: string, enum: [todo, in_progress, in_review, done]}
        assigneeAgentId: {type: string}
        labels: {type: array, items: {type: string}}
        components: {type: array, items: {$ref: "#/components/schemas/Component"}}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    TaskComment:
      type: object
      required: [id, workspaceId, taskId, authorUserId, body, createdAt]
      properties:
        id: {type: string}
        workspaceId: {type: string}
        taskId: {type: string}
        authorUserId: {type: string}
        body: {type: string}
        createdAt: {type: string, format: date-time}
    ComponentInput:
      type: object
      required: [identifier, name, repositoryId]
      properties:
        identifier: {type: string, minLength: 1, maxLength: 100}
        name: {type: string, minLength: 1, maxLength: 200}
        repositoryId: {type: string}
        description: {type: string, maxLength: 2000}
    Component:
      type: object
      required: [id, workspaceId, identifier, name, repositoryId, description, createdAt, updatedAt]
      properties:
        id: {type: string}
        workspaceId: {type: string}
        identifier: {type: string}
        name: {type: string}
        repositoryId: {type: string}
        description: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    Agent:
      type: object
      required: [id, workspaceId, name, runtime, provider, model, description, systemPrompt, mcpServerIds, skillIds]
      properties:
        id: {type: string}
        workspaceId: {type: string}
        name: {type: string}
        runtime: {type: string, enum: [opencode]}
        provider: {type: string}
        model: {type: string}
        description: {type: string}
        systemPrompt: {type: string}
        mcpServerIds: {type: array, items: {type: string}}
        skillIds: {type: array, items: {type: string}}
    MCPServer:
      type: object
      required: [id, workspaceId, name, url, hasHeaders]
      properties:
        id: {type: string}
        workspaceId: {type: string}
        name: {type: string}
        url: {type: string, format: uri}
        hasHeaders: {type: boolean}
    CodeRepository:
      type: object
      required: [id, workspaceId, providerName, url]
      properties:
        id: {type: string}
        workspaceId: {type: string}
        providerName: {type: string, enum: [github]}
        url: {type: string, format: uri}
    CodeRepositoryCreate:
      type: object
      required: [providerName, url]
      additionalProperties: false
      properties:
        providerName: {type: string, enum: [github]}
        url: {type: string, format: uri}
    TaskIntegrationInput:
      type: object
      required: [provider, name, config]
      properties:
        provider: {type: string}
        name: {type: string, minLength: 1, maxLength: 200}
        enabled: {type: boolean}
        config: {$ref: "#/components/schemas/TaskIntegrationConfig"}
        labels: {type: array, items: {type: string}}
        interval: {type: string, example: 5m}
        credential: {type: string, writeOnly: true}
    TaskIntegration:
      type: object
      required: [id, workspaceId, provider, name, enabled, config, labels, interval, createdAt, updatedAt]
      properties:
        id: {type: string}
        workspaceId: {type: string}
        provider: {type: string}
        name: {type: string}
        enabled: {type: boolean}
        config: {$ref: "#/components/schemas/TaskIntegrationConfig"}
        labels: {type: array, items: {type: string}}
        interval: {type: string}
        lastSynced: {type: string, format: date-time}
        lastError: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    TaskIntegrationConfig:
      type: object
      description: Provider-defined config. Retrieve allowed fields and constraints from GET /api/task-integration-providers.
      additionalProperties: true
    TaskIntegrationProvider:
      type: object
      required: [provider, configSchema]
      properties:
        provider: {type: string}
        configSchema:
          type: object
          description: JSON Schema that validates the provider-specific TaskIntegrationInput config.
          additionalProperties: true
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

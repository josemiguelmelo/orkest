components:
  requestBodies:
    NamedResource:
      required: true
      content:
        application/json:
          schema: {type: object, required: [name], properties: {name: {type: string, minLength: 1, maxLength: 200}}}
    OrganizationRole:
      required: true
      content:
        application/json:
          schema: {type: object, required: [role], properties: {role: {type: string, enum: [owner, admin, member]}}}
    WorkspaceRole:
      required: true
      content:
        application/json:
          schema: {type: object, required: [role], properties: {role: {type: string, enum: [admin, member, viewer]}}}
    AgentDefinition:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, runtime, provider, model, description, systemPrompt, permissionPolicy]
            properties:
              name: {type: string, minLength: 1, maxLength: 200}
              runtime: {type: string, enum: [opencode, claude-code, codex]}
              provider: {type: string, minLength: 1, maxLength: 200}
              model: {type: string, minLength: 1, maxLength: 200}
              description: {type: string, maxLength: 2000}
              systemPrompt: {type: string, maxLength: 100000}
              permissionPolicy: {type: string, enum: [ask, autonomous], description: Ask preserves provider approval prompts; autonomous disables interactive approval. Native sandbox behavior varies by provider; task environments remain isolated.}
              executionProfileId: {type: string, description: Profile ID; empty string clears the selection.}
              mcpServerIds: {type: array, uniqueItems: true, items: {type: string}}
              skillIds: {type: array, uniqueItems: true, items: {type: string}}
            additionalProperties: false
    MCPServerInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, url]
            additionalProperties: false
            properties:
              name: {type: string, minLength: 1, maxLength: 200}
              url: {type: string, format: uri}
              headers: {type: object, additionalProperties: {type: string}, writeOnly: true}
    CodeRepositoryCreate:
      required: true
      content:
        application/json:
          schema: {$ref: "#/components/schemas/CodeRepositoryCreate"}
    TaskIntegration:
      required: true
      content:
        application/json:
          schema: {$ref: "#/components/schemas/TaskIntegrationInput"}
  responses:
    Unauthorized: {description: Missing or invalid credentials, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    Forbidden: {description: Insufficient role permissions, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    NotFound: {description: Resource is absent or inaccessible, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    BadRequest: {description: Request body or role is invalid, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    Conflict: {description: Operation conflicts with an existing resource or invariant, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    BadGateway: {description: Coding provider rejected the connection or failed to respond, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    SkillInput:
      type: object
      required: [skillMD]
      properties:
        skillMD: {type: string, minLength: 1, maxLength: 100000, description: Complete SKILL.md including required frontmatter}
      additionalProperties: false
    Skill:
      type: object
      required: [id, scope, skillMD, createdAt, updatedAt]
      properties:
        id: {type: string}
        scope: {type: string, enum: [global, organization, workspace]}
        organizationId: {type: string}
        workspaceId: {type: string}
        skillMD: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    Skills:
      type: array
      items: {$ref: "#/components/schemas/Skill"}
    CurrentUser:
      type: object
      required:
        - user
        - organizations
        - platformAdmin
      properties:
        user: {$ref: "#/components/schemas/User"}
        organizations: {type: array, items: {$ref: "#/components/schemas/Organization"}}
        platformAdmin:
          type: boolean
          readOnly: true
    User:
      type: object
      required: [id, username, email]
      properties:
        id: {type: string}
        username: {type: string}
        email: {type: string}
    Organization:
      type: object
      required: [id, name]
      properties:
        id: {type: string}
        name: {type: string}
        role: {type: string, enum: [owner, admin, member]}
    Workspace:
      type: object
      required: [id, organizationId, name]
      properties:
        id: {type: string}
        organizationId: {type: string}
        name: {type: string}
        role: {type: string, enum: [owner, admin, member, viewer]}
    WorkspaceEnvironmentInput:
      type: object
      required: [value]
      properties:
        value: {type: string, maxLength: 65536}
        secret: {type: boolean, default: false}
    WorkspaceEnvironmentValue:
      type: object
      required: [name, secret]
      properties:
        name: {type: string}
        secret: {type: boolean}
        value: {type: string, description: Omitted for secrets}
    Membership:
      type: object
      required: [user, role]
      properties:
        user: {$ref: "#/components/schemas/User"}
        role: {type: string, enum: [owner, admin, member, viewer]}
    TaskInput:
      type: object
      required: [title]
      properties:
        startWork: {type: boolean, description: Explicitly start another work step after a failed run; active execution conflicts.}
        sessionMode: {type: string, enum: [continue, new], description: Session choice when explicitly starting work. Defaults to continue when a session exists.}
        promptText: {type: string, maxLength: 262144, description: Optional initial prompt for a user-started work step.}
        commandId: {type: string, maxLength: 200}
        title: {type: string, minLength: 1, maxLength: 500}
        description: {type: string, maxLength: 100000}
        status: {type: string, enum: [todo, in_progress, in_review, done]}
        assigneeAgentId: {type: string}
        labels: {type: array, items: {type: string}}
        repositoryIds: {type: array, items: {type: string}}
      additionalProperties: false
    Task:
      type: object
      required: [id, workspaceId, title, description, sourceProvider, status, labels, repositories, createdAt, updatedAt]
      properties:
        id: {type: string}
        workspaceId: {type: string}
        title: {type: string}
        description: {type: string}
        sourceProvider: {type: string}
        sourceId: {type: string}
        sourceUrl:
          type: string
          description: Source link, possibly empty for draft items.
        status: {type: string, enum: [todo, in_progress, in_review, done]}
        assigneeAgentId: {type: string}
        labels: {type: array, items: {type: string}}
        repositories: {type: array, items: {$ref: "#/components/schemas/TaskRepository"}}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    TaskRepository:
      type: object
      required: [id, providerName, name, url]
      properties:
        id: {type: string}
        providerName: {type: string}
        name: {type: string}
        url: {type: string, format: uri}
    TaskComment:
      type: object
      required: [id, workspaceId, taskId, authorUserId, body, createdAt]
      properties:
        id: {type: string}
        workspaceId: {type: string}
        taskId: {type: string}
        authorUserId: {type: string}
        body: {type: string, maxLength: 20000}
        createdAt: {type: string, format: date-time}
    TaskRun:
      type: object
      required: [runId, taskId, status, lastSequence, updatedAt]
      properties:
        executionImage: {type: string}
        recoveryBlocked: {type: boolean}
        executionState: {type: string}
        queuePaused: {type: boolean}
        queueDepth: {type: integer, minimum: 0}
        runId: {type: string}
        taskSessionId: {type: string}
        taskId: {type: string}
        status: {type: string}
        failureStage: {type: string}
        failureReason: {type: string}
        lastSequence: {type: integer, minimum: 0}
        updatedAt: {type: string, format: date-time}
    TaskRunEvent:
      type: object
      required: [runId, sequence, payload]
      properties:
        runId: {type: string}
        sequence: {type: integer, minimum: 1}
        payload: {type: object, additionalProperties: true}
    ExecutionProfileInput:
      type: object
      required: [name, description, runtime, toolchainImage]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 2000}
        runtime: {type: string, enum: [opencode, claude-code, codex]}
        toolchainImage: {type: string, minLength: 1}
        generation: {type: integer, format: int64, minimum: 0}
    ExecutionProfile:
      allOf:
        - {$ref: "#/components/schemas/ExecutionProfileInput"}
        - type: object
          required: [id, workspaceId, generation, status, executionImage, buildError, createdAt, updatedAt]
          properties:
            id: {type: string}
            workspaceId: {type: string}
            generation: {type: integer, format: int64}
            status: {type: string}
            executionImage: {type: string}
            buildError: {type: string}
            createdAt: {type: string, format: date-time}
            updatedAt: {type: string, format: date-time}
    ExecutionProfileBuild:
      type: object
      required: [id, profileId, workspaceId, generation, runtime, toolchainImage, baseImage, destination, status, executionImage, buildError, createdAt]
      properties:
        id: {type: string}
        profileId: {type: string}
        workspaceId: {type: string}
        generation: {type: integer, format: int64}
        runtime: {type: string, enum: [opencode, claude-code, codex]}
        toolchainImage: {type: string}
        baseImage: {type: string}
        runtimeVersion: {type: string}
        resolvedToolchain: {type: string}
        resolvedBase: {type: string}
        destination: {type: string}
        status: {type: string}
        executionImage: {type: string}
        buildError: {type: string}
        createdAt: {type: string, format: date-time}
    Agent:
      type: object
      required: [id, workspaceId, name, runtime, provider, model, description, systemPrompt, permissionPolicy, mcpServerIds, skillIds]
      properties:
        executionProfileId: {type: string}
        id: {type: string}
        workspaceId: {type: string}
        name: {type: string}
        runtime: {type: string, enum: [opencode, claude-code, codex]}
        provider: {type: string}
        model: {type: string}
        description: {type: string}
        systemPrompt: {type: string}
        permissionPolicy: {type: string, enum: [ask, autonomous]}
        mcpServerIds: {type: array, items: {type: string}}
        skillIds: {type: array, items: {type: string}}
    MCPServer:
      type: object
      required: [id, workspaceId, name, url, hasHeaders]
      properties:
        id: {type: string}
        workspaceId: {type: string}
        name: {type: string}
        url: {type: string, format: uri}
        hasHeaders: {type: boolean}
    CodeRepository:
      type: object
      required: [id, workspaceId, providerName, url, defaultBranch, private]
      properties:
        id: {type: string}
        workspaceId: {type: string}
        providerName: {type: string, enum: [github, gitlab_cloud, gitlab_server]}
        url: {type: string, format: uri}
        integrationId: {type: string}
        providerRepositoryId: {type: string}
        defaultBranch: {type: string}
        name: {type: string}
        private: {type: boolean}
    CodingIntegrationInput:
      type: object
      required: [name, providerName]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        providerName: {type: string, enum: [github, gitlab_cloud, gitlab_server]}
        providerConfig: {type: object, additionalProperties: true}
        credential: {type: string, writeOnly: true}
      additionalProperties: false
    CodingIntegration:
      type: object
      required: [id, workspaceId, name, providerName, providerConfig]
      properties:
        id: {type: string}
        workspaceId: {type: string}
        name: {type: string}
        providerName: {type: string, enum: [github, gitlab_cloud, gitlab_server]}
        providerConfig: {type: object, additionalProperties: true}
        updatedAt: {type: string}
    CodingProvider:
      type: object
      required: [providerName, configSchema]
      properties:
        providerName: {type: string, enum: [github, gitlab_cloud, gitlab_server]}
        configSchema: {type: object, additionalProperties: true}
    CodingRepository:
      type: object
      required: [id, name, cloneUrl, private, defaultBranch]
      properties:
        id: {type: string}
        name: {type: string}
        cloneUrl: {type: string, format: uri}
        private: {type: boolean}
        defaultBranch: {type: string}
    CodingRepositoryPage:
      type: object
      required: [repositories]
      properties:
        repositories: {type: array, items: {$ref: "#/components/schemas/CodingRepository"}}
        nextPage: {type: integer}
    CodingIntegrationValidation:
      type: object
      required: [connected]
      properties:
        connected: {type: boolean}
    CodeRepositoryCreate:
      type: object
      required: [integrationId, providerRepositoryId]
      additionalProperties: false
      properties:
        integrationId: {type: string}
        providerRepositoryId: {type: string}
    TaskIntegrationInput:
      type: object
      required: [provider, name, config]
      properties:
        provider: {type: string}
        name: {type: string, minLength: 1, maxLength: 200}
        enabled: {type: boolean}
        config: {$ref: "#/components/schemas/TaskIntegrationConfig"}
        labels: {type: array, items: {type: string}}
        interval: {type: string, example: 5m}
        credential: {type: string, writeOnly: true}
      additionalProperties: false
    TaskIntegration:
      type: object
      required: [id, workspaceId, provider, name, enabled, config, labels, interval, createdAt, updatedAt]
      properties:
        id: {type: string}
        workspaceId: {type: string}
        provider: {type: string}
        name: {type: string}
        enabled: {type: boolean}
        config: {$ref: "#/components/schemas/TaskIntegrationConfig"}
        labels: {type: array, items: {type: string}}
        interval: {type: string}
        lastSynced: {type: string, format: date-time}
        lastError: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    TaskIntegrationConfig:
      type: object
      description: Provider-defined config. Retrieve allowed fields and constraints from GET /api/task-integration-providers.
      additionalProperties: true
    TaskIntegrationProvider:
      type: object
      required: [provider, configSchema]
      properties:
        provider: {type: string}
        configSchema:
          type: object
          description: JSON Schema that validates the provider-specific TaskIntegrationInput config.
          additionalProperties: true
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
    OperationStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: orkest_session

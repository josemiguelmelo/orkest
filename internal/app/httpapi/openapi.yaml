openapi: 3.1.0
info:
  title: Orkest API
  version: 0.0.0
tags:
  - name: System
    description: Process health and service metadata.
  - name: Authentication
    description: Sign in and sign out through the configured OpenID Connect provider.
  - name: Users
    description: Operations for the authenticated user.
  - name: Organizations
    description: Organizations and organization memberships.
  - name: Workspaces
    description: Workspaces and workspace memberships.
  - name: Agents
    description: Workspace-scoped reusable agent definitions.
  - name: Skills
    description: Global, organization, and workspace Agent Skills catalog.
  - name: MCPServers
    description: Workspace-scoped HTTP MCP server connections.
  - name: CodeRepositories
    description: Workspace-scoped code repository registration and Git operations.
  - name: TaskIntegrations
    description: Workspace-scoped external task source integrations.
  - name: Tasks
    description: Workspace-scoped manual tasks, comments, and components.
  - name: TemporaryExecution
    description: Temporary authenticated endpoint for manually testing agent launches.
paths:
  /api/temp/agent-launch:
    post:
      tags: [TemporaryExecution]
      operationId: temporaryLaunchAgentWithPrompt
      summary: Start a Docker agent and submit its first prompt (temporary)
      description: Available only when ORKEST_ENABLE_TEMP_AGENT_LAUNCH=true. Requires authentication. Intended for local manual testing and does not perform task or workspace authorization.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TempAgentLaunchRequest"}
      responses:
        "202": {description: Agent started and prompt accepted}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "502": {description: Agent launch or prompt submission failed}
        "404": {description: Temporary endpoint is disabled}
  /healthz:
    get:
      tags: [System]
      operationId: getHealth
      summary: Process liveness (does not check database or runtime readiness)
      responses:
        "200":
          description: HTTP process is running
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
  /auth/login:
    get:
      tags: [Authentication]
      operationId: startLogin
      summary: Redirect to Keycloak for sign-in
      responses:
        "302":
          description: Redirect to the OIDC provider
  /auth/callback:
    get:
      tags: [Authentication]
      operationId: completeLogin
      summary: Complete Keycloak authorization code login
      responses:
        "303":
          description: Login succeeded and an HTTP-only session cookie was set
        "400":
          description: Invalid login state
        "401":
          description: Token exchange or validation failed
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Clear the local session cookie
      responses:
        "204":
          description: Session cleared
  /api/me:
    get:
      tags: [Users]
      operationId: getCurrentUser
      summary: Return the authenticated Keycloak identity
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Internal user profile and organization memberships
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: Missing or invalid access token
  /api/organizations:
    get:
      tags: [Organizations]
      operationId: listOrganizations
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Organizations the user belongs to, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Organization"}}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
    post:
      tags: [Organizations]
      operationId: createOrganization
      security: [{bearerAuth: []}]
      requestBody: {$ref: "#/components/requestBodies/NamedResource"}
      responses:
        "201": {description: Organization created; creator is Owner, content: {application/json: {schema: {$ref: "#/components/schemas/Organization"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/organizations/{orgID}:
    parameters:
      - {name: orgID, in: path, required: true, schema: {type: string}}
    get:
      tags: [Organizations]
      operationId: getOrganization
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Organization, content: {application/json: {schema: {$ref: "#/components/schemas/Organization"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      tags: [Organizations]
      operationId: updateOrganization
      security: [{bearerAuth: []}]
      requestBody: {$ref: "#/components/requestBodies/NamedResource"}
      responses:
        "200": {description: Updated organization, content: {application/json: {schema: {$ref: "#/components/schemas/Organization"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags: [Organizations]
      operationId: deleteOrganization
      security: [{bearerAuth: []}]
      responses:
        "204": {description: Organization deleted}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    # Membership changes are limited to users registered on a prior login.
  /api/organizations/{orgID}/members:
    parameters:
      - {name: orgID, in: path, required: true, schema: {type: string}}
    get:
      tags: [Organizations]
      operationId: listOrganizationMembers
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Organization members, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Membership"}}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/organizations/{orgID}/members/{userID}:
    parameters:
      - {name: orgID, in: path, required: true, schema: {type: string}}
      - {name: userID, in: path, required: true, schema: {type: string}}
    put:
      tags: [Organizations]
      operationId: setOrganizationMember
      security: [{bearerAuth: []}]
      requestBody: {$ref: "#/components/requestBodies/OrganizationRole"}
      responses:
        "200": {description: Membership updated}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
    delete:
      tags: [Organizations]
      operationId: removeOrganizationMember
      security: [{bearerAuth: []}]
      responses:
        "204": {description: Membership removed}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/organizations/{orgID}/workspaces:
    parameters:
      - {name: orgID, in: path, required: true, schema: {type: string}}
    get:
      tags: [Workspaces]
      operationId: listWorkspaces
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Workspaces accessible to the user, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Workspace"}}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
    post:
      tags: [Workspaces]
      operationId: createWorkspace
      security: [{bearerAuth: []}]
      requestBody: {$ref: "#/components/requestBodies/NamedResource"}
      responses:
        "201": {description: Workspace created, content: {application/json: {schema: {$ref: "#/components/schemas/Workspace"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/organizations/{orgID}/workspaces/{workspaceID}:
    parameters:
      - {name: orgID, in: path, required: true, schema: {type: string}}
      - {name: workspaceID, in: path, required: true, schema: {type: string}}
    get:
      tags: [Workspaces]
      operationId: getWorkspace
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Workspace, content: {application/json: {schema: {$ref: "#/components/schemas/Workspace"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      tags: [Workspaces]
      operationId: updateWorkspace
      security: [{bearerAuth: []}]
      requestBody: {$ref: "#/components/requestBodies/NamedResource"}
      responses:
        "200": {description: Updated workspace, content: {application/json: {schema: {$ref: "#/components/schemas/Workspace"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags: [Workspaces]
      operationId: deleteWorkspace
      security: [{bearerAuth: []}]
      responses:
        "204": {description: Workspace deleted}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/organizations/{orgID}/workspaces/{workspaceID}/members:
    parameters:
      - {name: orgID, in: path, required: true, schema: {type: string}}
      - {name: workspaceID, in: path, required: true, schema: {type: string}}
    get:
      tags: [Workspaces]
      operationId: listWorkspaceMembers
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Workspace members, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Membership"}}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/organizations/{orgID}/workspaces/{workspaceID}/members/{userID}:
    parameters:
      - {name: orgID, in: path, required: true, schema: {type: string}}
      - {name: workspaceID, in: path, required: true, schema: {type: string}}
      - {name: userID, in: path, required: true, schema: {type: string}}
    put:
      tags: [Workspaces]
      operationId: setWorkspaceMember
      security: [{bearerAuth: []}]
      requestBody: {$ref: "#/components/requestBodies/WorkspaceRole"}
      responses:
        "200": {description: Membership updated}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags: [Workspaces]
      operationId: removeWorkspaceMember
      security: [{bearerAuth: []}]
      responses:
        "204": {description: Membership removed}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/organizations/{orgID}/workspaces/{workspaceID}/code-repositories:
    parameters:
      - {name: orgID, in: path, required: true, schema: {type: string}}
      - {name: workspaceID, in: path, required: true, schema: {type: string}}
    get:
      tags: [CodeRepositories]
      operationId: listCodeRepositories
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Workspace code repositories, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/CodeRepository"}}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    post:
      tags: [CodeRepositories]
      operationId: createCodeRepository
      security: [{bearerAuth: []}]
      requestBody: {$ref: "#/components/requestBodies/CodeRepositoryCreate"}
      responses:
        "201": {description: Code repository registered, content: {application/json: {schema: {$ref: "#/components/schemas/CodeRepository"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/organizations/{orgID}/workspaces/{workspaceID}/code-repositories/{repositoryID}:
    parameters:
      - {name: orgID, in: path, required: true, schema: {type: string}}
      - {name: workspaceID, in: path, required: true, schema: {type: string}}
      - {name: repositoryID, in: path, required: true, schema: {type: string}}
    get:
      tags: [CodeRepositories]
      operationId: getCodeRepository
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Registered code repository, content: {application/json: {schema: {$ref: "#/components/schemas/CodeRepository"}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags: [CodeRepositories]
      operationId: deleteCodeRepository
      security: [{bearerAuth: []}]
      responses:
        "204": {description: Code repository removed}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/organizations/{orgID}/workspaces/{workspaceID}/code-repositories/{repositoryID}/clone:
    parameters:
      - {name: orgID, in: path, required: true, schema: {type: string}}
      - {name: workspaceID, in: path, required: true, schema: {type: string}}
      - {name: repositoryID, in: path, required: true, schema: {type: string}}
    post:
      tags: [CodeRepositories]
      operationId: cloneCodeRepository
      security: [{bearerAuth: []}]
      responses:
        "204": {description: Repository cloned}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/organizations/{orgID}/workspaces/{workspaceID}/code-repositories/{repositoryID}/sync-main:
    parameters:
      - {name: orgID, in: path, required: true, schema: {type: string}}
      - {name: workspaceID, in: path, required: true, schema: {type: string}}
      - {name: repositoryID, in: path, required: true, schema: {type: string}}
    post:
      tags: [CodeRepositories]
      operationId: syncCodeRepositoryMain
      security: [{bearerAuth: []}]
      responses:
        "204": {description: Checkout reset to the latest remote main branch}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/organizations/{orgID}/workspaces/{workspaceID}/task-integrations:
    parameters:
      - {name: orgID, in: path, required: true, schema: {type: string}}
      - {name: workspaceID, in: path, required: true, schema: {type: string}}
    get:
      tags: [TaskIntegrations]
      operationId: listTaskIntegrations
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Configured task integrations, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/TaskIntegration"}}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    post:
      tags: [TaskIntegrations]
      operationId: createTaskIntegration
      security: [{bearerAuth: []}]
      requestBody: {$ref: "#/components/requestBodies/TaskIntegration"}
      responses:
        "201": {description: Integration configured, content: {application/json: {schema: {$ref: "#/components/schemas/TaskIntegration"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "502": {description: Provider connectivity or credential validation failed}
        "503": {description: Integration credential encryption is not configured}
  /api/task-integration-providers:
    get:
      tags: [TaskIntegrations]
      operationId: listTaskIntegrationProviders
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Available providers and their config schemas, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/TaskIntegrationProvider"}}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/organizations/{orgID}/workspaces/{workspaceID}/task-integrations/validate:
    parameters:
      - {name: orgID, in: path, required: true, schema: {type: string}}
      - {name: workspaceID, in: path, required: true, schema: {type: string}}
    post:
      tags: [TaskIntegrations]
      operationId: validateTaskIntegration
      security: [{bearerAuth: []}]
      requestBody: {$ref: "#/components/requestBodies/TaskIntegration"}
      responses:
        "200": {description: Connectivity validated}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "502": {description: Provider connectivity or credential validation failed}
  /api/organizations/{orgID}/workspaces/{workspaceID}/task-integrations/{integrationID}:
    parameters:
      - {name: orgID, in: path, required: true, schema: {type: string}}
      - {name: workspaceID, in: path, required: true, schema: {type: string}}
      - {name: integrationID, in: path, required: true, schema: {type: string}}
    put:
      tags: [TaskIntegrations]
      operationId: updateTaskIntegration
      security: [{bearerAuth: []}]
      requestBody: {$ref: "#/components/requestBodies/TaskIntegration"}
      responses:
        "200": {description: Integration updated, content: {application/json: {schema: {$ref: "#/components/schemas/TaskIntegration"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "502": {description: Provider connectivity or credential validation failed}
        "503": {description: Integration credential encryption is not configured}
    delete:
      tags: [TaskIntegrations]
      operationId: deleteTaskIntegration
      security: [{bearerAuth: []}]
      responses:
        "204": {description: Integration deleted}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/organizations/{orgID}/workspaces/{workspaceID}/task-integrations/{integrationID}/sync:
    parameters:
      - {name: orgID, in: path, required: true, schema: {type: string}}
      - {name: workspaceID, in: path, required: true, schema: {type: string}}
      - {name: integrationID, in: path, required: true, schema: {type: string}}
    post:
      tags: [TaskIntegrations]
      operationId: syncTaskIntegrationNow
      security: [{bearerAuth: []}]
      responses:
        "204": {description: Synchronization completed}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/organizations/{orgID}/workspaces/{workspaceID}/mcp-servers:
    parameters:
      - {name: orgID, in: path, required: true, schema: {type: string}}
      - {name: workspaceID, in: path, required: true, schema: {type: string}}
    get:
      tags: [MCPServers]
      operationId: listMCPServers
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Workspace MCP servers, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/MCPServer"}}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      tags: [MCPServers]
      operationId: createMCPServer
      security: [{bearerAuth: []}]
      requestBody: {$ref: "#/components/requestBodies/MCPServerInput"}
      responses:
        "201": {description: MCP server created, content: {application/json: {schema: {$ref: "#/components/schemas/MCPServer"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "503": {description: MCP credential encryption is not configured}
  /api/organizations/{orgID}/workspaces/{workspaceID}/mcp-servers/{serverID}:
    parameters:
      - {name: orgID, in: path, required: true, schema: {type: string}}
      - {name: workspaceID, in: path, required: true, schema: {type: string}}
      - {name: serverID, in: path, required: true, schema: {type: string}}
    put:
      tags: [MCPServers]
      operationId: updateMCPServer
      security: [{bearerAuth: []}]
      requestBody: {$ref: "#/components/requestBodies/MCPServerInput"}
      responses:
        "200": {description: MCP server updated; omitted headers preserve existing credentials, content: {application/json: {schema: {$ref: "#/components/schemas/MCPServer"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {description: MCP credential encryption is not configured}
    delete:
      tags: [MCPServers]
      operationId: deleteMCPServer
      security: [{bearerAuth: []}]
      responses:
        "204": {description: MCP server deleted and removed from agent selections}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/organizations/{orgID}/workspaces/{workspaceID}/agents:
    parameters:
      - {name: orgID, in: path, required: true, schema: {type: string}}
      - {name: workspaceID, in: path, required: true, schema: {type: string}}
    get:
      tags: [Agents]
      operationId: listAgents
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Workspace agents, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Agent"}}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    post:
      tags: [Agents]
      operationId: createAgent
      security: [{bearerAuth: []}]
      requestBody: {$ref: "#/components/requestBodies/AgentDefinition"}
      responses:
        "201": {description: Agent created, content: {application/json: {schema: {$ref: "#/components/schemas/Agent"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/organizations/{orgID}/workspaces/{workspaceID}/agents/{agentID}:
    parameters:
      - {name: orgID, in: path, required: true, schema: {type: string}}
      - {name: workspaceID, in: path, required: true, schema: {type: string}}
      - {name: agentID, in: path, required: true, schema: {type: string}}
    get:
      tags: [Agents]
      operationId: getAgent
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Agent definition, content: {application/json: {schema: {$ref: "#/components/schemas/Agent"}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      tags: [Agents]
      operationId: updateAgent
      security: [{bearerAuth: []}]
      requestBody: {$ref: "#/components/requestBodies/AgentDefinition"}
      responses:
        "200": {description: Agent updated, content: {application/json: {schema: {$ref: "#/components/schemas/Agent"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags: [Agents]
      operationId: deleteAgent
      security: [{bearerAuth: []}]
      responses:
        "204": {description: Agent deleted}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/organizations/{orgID}/workspaces/{workspaceID}/tasks:
    parameters:
      - {name: orgID, in: path, required: true, schema: {type: string}}
      - {name: workspaceID, in: path, required: true, schema: {type: string}}
    get:
      tags: [Tasks]
      operationId: listTasks
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Workspace tasks, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Task"}}}}}
    post:
      tags: [Tasks]
      operationId: createTask
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/TaskInput"}}}}
      responses:
        "201": {description: Created task, content: {application/json: {schema: {$ref: "#/components/schemas/Task"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /api/organizations/{orgID}/workspaces/{workspaceID}/tasks/{taskID}:
    parameters:
      - {name: orgID, in: path, required: true, schema: {type: string}}
      - {name: workspaceID, in: path, required: true, schema: {type: string}}
      - {name: taskID, in: path, required: true, schema: {type: string}}
    get:
      tags: [Tasks]
      operationId: getTask
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Task, content: {application/json: {schema: {$ref: "#/components/schemas/Task"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      tags: [Tasks]
      operationId: updateTask
      description: Moving an assigned task from todo to in_progress starts its assigned agent with the task title, description, labels, and component details. A dispatch failure leaves the task in_progress and returns 502.
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/TaskInput"}}}}
      responses:
        "200": {description: Updated task, content: {application/json: {schema: {$ref: "#/components/schemas/Task"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}

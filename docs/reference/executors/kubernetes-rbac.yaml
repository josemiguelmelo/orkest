apiVersion: v1
kind: ServiceAccount
metadata:
  name: orkest-agentctl
  namespace: default
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: orkest-executor
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "secrets"]
    verbs: ["get", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: orkest-executor
  namespace: default
subjects:
  # Bind this to the platform Pod's service account, not orkest-agentctl.
  - kind: ServiceAccount
    name: orkest-platform
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: orkest-executor
